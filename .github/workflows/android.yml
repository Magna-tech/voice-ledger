name: Android build

on:
  push:
    branches: [main]
    paths: ['android/**', 'site/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', 'site/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Build debug and release APKs
        working-directory: android
        run: gradle assembleDebug assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: voice-ledger-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
      # The release APK is unsigned here; the signing key never leaves the maintainer's machine.
      - uses: actions/upload-artifact@v4
        with:
          name: voice-ledger-release-unsigned
          path: android/app/build/outputs/apk/release/*.apk
